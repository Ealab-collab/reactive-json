# test-url-builder.yaml
# Tests the new URL builder features for additionalDataSource src:
#
#   { param, value }         — query param objects
#   { segment, required? }   — dynamic path segment objects
#   ~. references            — treated same as ~~. (root store) in this context
#   required flag            — aborts URL resolution → triggers fallbackDataSource
#   fallbackDataSource       — tried on null URL or HTTP error
#
# Requires the fake backend:
#   node test-datasync-server.mjs
#
# Open at:
#   http://localhost:5173/?file_path=/rjs-build/test-url-builder.yaml

additionalDataSource:

  # --- Test A: { segment } + { param } with dynamic key ---
  # URL built: http://localhost:3099/api/catalog/electronics?id=42&q=hello
  - src:
      - "http://localhost:3099/api/catalog/"
      - segment: ~~.category    # dynamic path segment
      - param: id
        value: ~~.apiId         # static key, store value
      - param: ~~.extraParamName
        value: ~~.extraParamValue  # both key and value from store
    path: ~~.resultA
    blocking: true

  # --- Test B: optional param silently omitted when null ---
  # URL built: http://localhost:3099/api/items?id=42
  # (filter is null → omitted without warning)
  - src:
      - "http://localhost:3099/api/items"
      - param: id
        value: ~~.apiId         # present → included
      - param: filter
        value: ~~.emptyFilter   # null → silently omitted
    path: ~~.resultB
    blocking: true

  # --- Test C: required param is null → fallbackDataSource ---
  # missingId is null → required aborts URL → fallback fetches a safe default
  - src:
      - "http://localhost:3099/api/items"
      - param: id
        value: ~~.missingId
        required: true
    fallbackDataSource:
      src: "http://localhost:3099/api/items?id=fallback"
      path: ~~.resultC
    blocking: true

  # --- Test D: HTTP 500 error → fallbackDataSource ---
  # /api/crash returns 500 → fallback recovers with a working URL
  - src: "http://localhost:3099/api/crash"
    fallbackDataSource:
      src: "http://localhost:3099/api/items?id=recovered"
      path: ~~.resultD
    blocking: true

data:
  apiId: "42"
  category: "electronics"
  extraParamName: "q"
  extraParamValue: "hello"
  emptyFilter: null
  missingId: null
  resultA: null
  resultB: null
  resultC: null
  resultD: null

